# goreleaser builds, packages and publishes releases. The release workflow runs
# it on semantic version tags; `just release-snapshot` runs it locally.
version: 2

project_name: isc

builds:
  - id: isc
    main: ./cmd/isc
    binary: isc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: isc
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# git-cliff writes the release notes (just release-notes); the release workflow
# passes them with --release-notes.
changelog:
  disable: true

release:
  # A tag like v1.2.0-rc.1 becomes a GitHub prerelease.
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"
