# Installs just (and optionally git-cliff) from their projects' own GitHub
# releases, at pinned versions with pinned checksums, instead of relying on
# third-party setup actions. Linux x86_64 runners only.
name: Set up tools
description: Install just and, optionally, git-cliff

inputs:
  git-cliff:
    description: Also install git-cliff
    default: "false"

runs:
  using: composite
  steps:
    - name: Install just
      shell: bash
      env:
        VERSION: "1.59.0"
        SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/tools/bin"
        mkdir -p "$dir"
        archive="$RUNNER_TEMP/just.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/casey/just/releases/download/$VERSION/just-$VERSION-x86_64-unknown-linux-musl.tar.gz"
        echo "$SHA256  $archive" | sha256sum -c -
        tar -xzf "$archive" -C "$dir" just
        echo "$dir" >> "$GITHUB_PATH"

    - name: Install git-cliff
      if: inputs.git-cliff == 'true'
      shell: bash
      env:
        VERSION: "2.14.2"
        SHA512: 26d1f7c8ea2400f2ccb0b2e7f321635f600b583bf4cd1f7afaa5e8c24068ad1088a2504e0a4d9f4333d4bb20a80329327d9462634343ee3af91e1a7fbdc6f18a
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/tools/bin"
        mkdir -p "$dir"
        archive="$RUNNER_TEMP/git-cliff.tar.gz"
        curl -fsSL -o "$archive" "https://github.com/orhun/git-cliff/releases/download/v$VERSION/git-cliff-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
        echo "$SHA512  $archive" | sha512sum -c -
        tar -xzf "$archive" -C "$dir" --strip-components=1 "git-cliff-$VERSION/git-cliff"
        echo "$dir" >> "$GITHUB_PATH"
