# git-cliff configuration: version bumps and release notes. The notes become the
# GitHub release description; there's no CHANGELOG.md in the repository.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Commits from before the project used Conventional Commits are left out of the
# notes. CI requires them on pull requests (just check-commits).
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^(build|ci)", group = "<!-- 4 -->Build and CI" },
  { message = ".*", group = "<!-- 5 -->Other" },
]
# Prerelease tags (v1.2.0-rc.1) don't move the base the next version is bumped from.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
# feat bumps minor, fix and the rest patch, breaking changes major; before 1.0.0
# breaking changes bump minor. Revisit breaking_always_bump_major at 1.0.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.0.1"
